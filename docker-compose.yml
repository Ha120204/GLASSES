services:
  postgres:
    image: postgres:16-alpine
    container_name: glasses-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: glasses_store
      POSTGRES_USER: glasses
      POSTGRES_PASSWORD: glasses
    ports:
      # 5432 is often occupied by an existing local PostgreSQL installation.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
